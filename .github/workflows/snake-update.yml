name: snake-update

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: atrepca
          # Colors are GitHub's current contribution-graph colors (Primer tokens).
          # The dark empty cell is a translucent tint so it matches both dark and dark dimmed.
          outputs: |
            dist/snake.svg?palette=github-light&color_dots=#eff2f5,#aceebb,#4ac26b,#2da44e,#116329&color_dot_border=#1f23280d&color_snake=#8250df
            dist/snake-dark.svg?palette=github-dark&color_dots=#c8dcff0c,#033a16,#196c2e,#2ea043,#56d364&color_dot_border=#0104090d&color_snake=#a371f7

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
